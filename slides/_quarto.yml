project:
  type: default
  output-dir: ../docs/slides
  render:
    - module-introduction.qmd
    - module-conclusion.qmd

format:
  revealjs:
    theme:
      - simple
      - ../assets/video-slides.scss
    width: 1600
    height: 900
    margin: 0
    controls: false
    menu: false
    progress: false
    slide-number: false
    transition: none
    background-transition: none
    center: false
    hash: true
    auto-stretch: false
    embed-resources: true
