<svg xmlns="http://www.w3.org/2000/svg" width="752" height="350"
  viewBox="0 0 752 350" role="img"
  aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Candidate genetic variant prioritization</title>
  <desc id="diagram-description">
    Published variants are linked to tissue expression, cell-type expression,
    and protein annotations to create a shortlist of candidate genetic variants
    for follow-up.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <g fill="none" stroke="#333333" stroke-width="1.5"
    marker-end="url(#arrow)">
    <path d="M 198 136 L 224 47 L 255 47"/>
    <path d="M 198 175 L 248 175"/>
    <path d="M 198 214 L 224 303 L 252 303"/>
    <path d="M 423 47 L 458 47 L 484 145"/>
    <path d="M 433 175 L 484 175"/>
    <path d="M 430 303 L 458 303 L 484 205"/>
  </g>

  <g font-family="Trebuchet MS, Verdana, Arial, sans-serif"
    font-size="16" text-anchor="middle">
    <g>
      <rect x="8" y="136" width="190" height="78" fill="#f6f7f7"
        stroke="#63666a"/>
      <text x="103" y="168" fill="#141415">Published variants</text>
      <text x="103" y="192" fill="#141415">54 rows, 25 genes</text>
    </g>

    <g>
      <rect x="255" y="8" width="168" height="78" fill="#cce4ef"
        stroke="#3d64b3"/>
      <text x="339" y="40" fill="#141415">GTEx</text>
      <text x="339" y="64" fill="#141415">Tissue expression</text>
    </g>

    <g>
      <rect x="248" y="136" width="185" height="78" fill="#cce4ef"
        stroke="#3d64b3"/>
      <text x="340.5" y="168" fill="#141415">HuBMAP</text>
      <text x="340.5" y="192" fill="#141415">Cell-type expression</text>
    </g>

    <g>
      <rect x="252" y="264" width="178" height="78" fill="#cce4ef"
        stroke="#3d64b3"/>
      <text x="341" y="296" fill="#141415">Pharos / IDG</text>
      <text x="341" y="320" fill="#141415">Protein annotations</text>
    </g>

    <g>
      <rect x="484" y="124" width="260" height="102" fill="#764c82"
        stroke="#5e3d68"/>
      <text x="614" y="155" fill="#ffffff">Shortlist of candidate</text>
      <text x="614" y="179" fill="#ffffff">genetic variants</text>
      <text x="614" y="203" fill="#ffffff">for follow-up</text>
    </g>
  </g>
</svg>
