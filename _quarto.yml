project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lessons/objectives.qmd
    - lessons/variant-context.qmd
    - lessons/gtex.qmd
    - lessons/hubmap.qmd
    - lessons/pharos.qmd
    - lessons/prioritization.qmd
    - lessons/conclusion.qmd
    - lessons/glossary.qmd
  resources:
    - api_helpers.py
    - data
    - notebooks/*.ipynb
    - assets/images

website:
  title: "Prioritizing Candidate Genetic Variants"
  site-url: "https://cfdetrainingcenter.github.io/candidate-genetic-variants/"
  repo-url: "https://github.com/CFDETrainingCenter/candidate-genetic-variants"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    background: secondary
    foreground: light
    search: true
    right:
      - href: lessons/glossary.qmd
        text: "Glossary"
        icon: book-fill
      - icon: github
        href: "https://github.com/CFDETrainingCenter/candidate-genetic-variants"
        aria-label: "View the source repository on GitHub"
  sidebar:
    style: docked
    search: false
    contents:
      - href: index.qmd
        text: "1. Module Introduction"
      - href: lessons/objectives.qmd
        text: "2. Introduction to APIs"
      - href: lessons/variant-context.qmd
        text: "3. Variant and Gene Context"
      - href: lessons/gtex.qmd
        text: "4. Tissue-Level Expression: GTEx"
      - href: lessons/hubmap.qmd
        text: "5. Cell-Type Resolution: HuBMAP"
      - href: lessons/pharos.qmd
        text: "6. Protein Context and Druggability: IDG/Pharos"
      - href: lessons/prioritization.qmd
        text: "7. Variant Prioritization and Interpretation"
      - href: lessons/conclusion.qmd
        text: "8. Conclusion"
  page-footer:
    left: |
      Developed by [Shaurita D. Hutchins](https://github.com/sdhutchins)
    center: |
      ![](/assets/images/cfde.svg){.footer-logo}
    right: |
      A community-sourced [CFDE Training Center](https://orau.org/cfde-trainingcenter/) module.
format:
  live-html:
    filters:
      - shortiquiz
    theme:
      - cosmo
      - assets/styles.scss
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    link-external-icon: true
    link-external-newwindow: true
    pyodide:
      packages:
        - pandas
        - matplotlib
        - requests
      resources:
        - api_helpers.py
        - data/variants.csv
        - data/gtex_expression.csv
        - data/hubmap_cell_expression.csv
        - data/pharos_target_context.csv
        - data/integrated_prioritization.csv
    live:
      show-hints: true
      show-solutions: true
      show-grading: true

execute:
  freeze: auto

language:
  title-block-published: "Updated"
